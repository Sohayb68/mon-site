<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de la zone d'intervention dans le Grand Est">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102f54"/><stop offset="1" stop-color="#0B1F3B"/></linearGradient>
  </defs>
  <rect width="600" height="520" fill="url(#mg)"/>
  <!-- subtle grid -->
  <g stroke="#1d3a5f" stroke-width="1" opacity=".6">
    <line x1="0" y1="130" x2="600" y2="130"/><line x1="0" y1="260" x2="600" y2="260"/><line x1="0" y1="390" x2="600" y2="390"/>
    <line x1="150" y1="0" x2="150" y2="520"/><line x1="300" y1="0" x2="300" y2="520"/><line x1="450" y1="0" x2="450" y2="520"/>
  </g>
  <!-- stylized Grand Est silhouette -->
  <path d="M150 70 L300 50 L430 90 L470 170 L500 300 L450 420 L380 470 L300 450 L240 470 L180 410 L150 300 L130 180 Z"
        fill="#16365c" stroke="#2ECC71" stroke-width="2.5" stroke-dasharray="6 7" opacity=".9"/>
  <!-- city points -->
  <g font-family="Inter, sans-serif" font-size="14" fill="#ffffff">
    <g><circle cx="300" cy="120" r="6" fill="#2ECC71"/><circle cx="300" cy="120" r="13" fill="#2ECC71" opacity=".25"/><text x="312" y="118">Reims</text></g>
    <g><circle cx="430" cy="150" r="6" fill="#2ECC71"/><text x="442" y="148">Metz</text></g>
    <g><circle cx="430" cy="250" r="6" fill="#2ECC71"/><text x="442" y="248">Nancy</text></g>
    <g><circle cx="460" cy="320" r="6" fill="#2ECC71"/><text x="472" y="318">Épinal</text></g>
    <g><circle cx="500" cy="170" r="7" fill="#fff"/><circle cx="500" cy="170" r="15" fill="#2ECC71" opacity=".3"/><text x="492" y="158" text-anchor="end">Strasbourg</text></g>
    <g><circle cx="480" cy="300" r="6" fill="#2ECC71"/><text x="468" y="298" text-anchor="end">Colmar</text></g>
    <g><circle cx="470" cy="380" r="9" fill="#fff"/><circle cx="470" cy="380" r="18" fill="#2ECC71" opacity=".35"/><text x="456" y="384" text-anchor="end" font-weight="700">Mulhouse</text></g>
    <g><circle cx="470" cy="430" r="6" fill="#2ECC71"/><text x="458" y="446" text-anchor="end">Saint-Louis</text></g>
    <g><circle cx="410" cy="410" r="6" fill="#2ECC71"/><text x="398" y="408" text-anchor="end">Belfort</text></g>
  </g>
  <!-- pulse ring on Mulhouse base -->
  <circle cx="470" cy="380" r="28" fill="none" stroke="#2ECC71" stroke-width="1.5" opacity=".4"/>
  <text x="40" y="490" font-family="Space Grotesk, sans-serif" font-size="13" fill="#8af0b6" letter-spacing="2">COUVERTURE GRAND EST</text>
</svg>
