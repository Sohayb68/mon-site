<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cave saturée et encombrée avant débarras">
  <rect width="800" height="600" fill="#544b3f"/>
  <rect y="440" width="800" height="160" fill="#3c352b"/>
  <!-- brick lines dim -->
  <g stroke="#463d31" stroke-width="3" opacity=".8">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="220" x2="800" y2="220"/><line x1="0" y1="330" x2="800" y2="330"/>
  </g>
  <!-- dim bulb -->
  <line x1="400" y1="0" x2="400" y2="60" stroke="#2f2a22" stroke-width="4"/>
  <circle cx="400" cy="72" r="13" fill="#8c7d4d"/>
  <!-- packed shelf -->
  <g stroke="#2c261d" stroke-width="6"><rect x="90" y="230" width="210" height="210" fill="#3a3328"/></g>
  <g>
    <rect x="100" y="240" width="40" height="55" fill="#7c8a5a"/><rect x="146" y="245" width="34" height="50" fill="#8a6b4a"/><rect x="186" y="240" width="48" height="55" fill="#6a7488"/><rect x="240" y="248" width="50" height="47" fill="#9a7c58"/>
    <rect x="100" y="305" width="60" height="55" fill="#8a6b4a"/><rect x="166" y="310" width="50" height="50" fill="#5d6b75"/><rect x="222" y="305" width="66" height="55" fill="#7c6346"/>
    <rect x="100" y="372" width="80" height="58" fill="#6d5640"/><rect x="186" y="378" width="100" height="52" fill="#7c8a5a"/>
  </g>
  <!-- wine bottles -->
  <g fill="#3f5a3a"><rect x="330" y="360" width="14" height="70" rx="6"/><rect x="350" y="356" width="14" height="74" rx="6"/><rect x="370" y="362" width="14" height="68" rx="6"/><rect x="390" y="358" width="14" height="72" rx="6"/></g>
  <!-- boxes pile -->
  <g stroke="#3a2f20" stroke-width="3">
    <rect x="450" y="350" width="130" height="90" fill="#9a7340"/><line x1="450" y1="395" x2="580" y2="395"/><line x1="515" y1="350" x2="515" y2="440"/>
    <rect x="470" y="270" width="100" height="80" fill="#86632f"/><line x1="520" y1="270" x2="520" y2="350"/>
    <rect x="600" y="370" width="120" height="70" fill="#a37c45"/>
  </g>
  <!-- old chair tipped -->
  <g transform="rotate(38 660 300)"><rect x="640" y="240" width="60" height="14" fill="#4f3b2c"/><rect x="640" y="254" width="12" height="60" fill="#4f3b2c"/><rect x="688" y="254" width="12" height="60" fill="#4f3b2c"/><rect x="640" y="200" width="14" height="60" fill="#4f3b2c"/></g>
  <!-- cobwebs -->
  <g stroke="#6b6354" stroke-width="2" fill="none" opacity=".7"><path d="M0 0c40 10 60 40 60 70"/><path d="M0 30c30 8 44 24 50 44"/><path d="M800 0c-40 10-60 40-60 70"/></g>
  <!-- floor clutter -->
  <g fill="#2c261d"><circle cx="200" cy="500" r="26"/><rect x="300" y="480" width="90" height="40" rx="6"/><rect x="430" y="490" width="70" height="36" rx="6" transform="rotate(-10 465 508)"/></g>
</svg>
