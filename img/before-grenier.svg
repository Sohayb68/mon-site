<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grenier encombré d'objets avant débarras">
  <rect width="800" height="600" fill="#5a5446"/>
  <!-- sloped roof dim -->
  <polygon points="0,260 400,40 800,260 800,0 0,0" fill="#403a30"/>
  <g stroke="#322d24" stroke-width="10"><line x1="120" y1="0" x2="220" y2="200"/><line x1="320" y1="0" x2="360" y2="160"/><line x1="680" y1="0" x2="580" y2="200"/></g>
  <polyline points="0,260 400,40 800,260" fill="none" stroke="#2c281f" stroke-width="12"/>
  <!-- floor -->
  <rect y="440" width="800" height="160" fill="#41382b"/>
  <!-- dim skylight -->
  <polygon points="300,150 500,150 470,250 330,250" fill="#7d8a93" stroke="#4a443a" stroke-width="8"/>
  <!-- clutter: suitcases stack -->
  <g stroke="#2c261d" stroke-width="3">
    <rect x="90" y="370" width="150" height="70" rx="8" fill="#6d4f3a"/><line x1="90" y1="405" x2="240" y2="405"/>
    <rect x="110" y="300" width="120" height="70" rx="8" fill="#7c5a45"/><line x1="110" y1="335" x2="230" y2="335"/>
    <rect x="130" y="240" width="90" height="60" rx="6" fill="#8a6b4a"/>
  </g>
  <!-- boxes -->
  <g stroke="#2c261d" stroke-width="3"><rect x="270" y="360" width="120" height="80" fill="#9a7340"/><line x1="270" y1="400" x2="390" y2="400"/><line x1="330" y1="360" x2="330" y2="440"/><rect x="290" y="290" width="90" height="70" fill="#86632f"/></g>
  <!-- old rocking horse / chair -->
  <g><rect x="430" y="350" width="120" height="80" rx="10" fill="#5d4636"/><rect x="430" y="320" width="30" height="80" rx="10" fill="#4f3b2c"/><rect x="520" y="320" width="30" height="80" rx="10" fill="#4f3b2c"/></g>
  <!-- lamp + picture frames leaning -->
  <g transform="rotate(-10 600 360)"><rect x="592" y="280" width="100" height="80" fill="#5d6b75" stroke="#3b454c" stroke-width="4"/></g>
  <g transform="rotate(8 660 380)"><rect x="630" y="300" width="80" height="100" fill="#7c6346" stroke="#4f3b2c" stroke-width="4"/></g>
  <!-- floor scatter -->
  <g fill="#2c261d"><circle cx="300" cy="500" r="24"/><rect x="400" y="480" width="90" height="40" rx="6"/><rect x="540" y="490" width="70" height="34" rx="6" transform="rotate(-8 575 507)"/><circle cx="160" cy="510" r="18"/></g>
  <!-- dust beam (weak) -->
  <polygon points="330,252 470,252 520,440 280,440" fill="#cfc08a" opacity=".07"/>
</svg>
