<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Salon encombré avant débarras">
  <defs>
    <linearGradient id="bsWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8d2c6"/><stop offset="1" stop-color="#c2bbac"/></linearGradient>
    <linearGradient id="bsFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3a589"/><stop offset="1" stop-color="#9c8e72"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bsWall)"/>
  <rect y="430" width="800" height="170" fill="url(#bsFloor)"/>
  <!-- window dim -->
  <rect x="500" y="90" width="230" height="270" rx="6" fill="#9fb0bd" stroke="#cfc8ba" stroke-width="10"/>
  <line x1="615" y1="90" x2="615" y2="360" stroke="#cfc8ba" stroke-width="8"/>
  <line x1="500" y1="225" x2="730" y2="225" stroke="#cfc8ba" stroke-width="8"/>
  <!-- crooked frame -->
  <g transform="rotate(-7 230 190)"><rect x="180" y="150" width="110" height="80" rx="3" fill="#8d7f66" stroke="#6f6450" stroke-width="6"/></g>
  <!-- clutter: stacked boxes -->
  <g stroke="#6f5b3e" stroke-width="3">
    <rect x="70" y="330" width="120" height="100" fill="#c79a5e"/><line x1="70" y1="370" x2="190" y2="370"/><line x1="130" y1="330" x2="130" y2="430"/>
    <rect x="95" y="250" width="95" height="80" fill="#b98a4d"/><line x1="142" y1="250" x2="142" y2="330"/>
    <rect x="200" y="360" width="110" height="70" fill="#d0a76b"/><line x1="200" y1="395" x2="310" y2="395"/>
  </g>
  <!-- old armchair -->
  <g>
    <rect x="330" y="350" width="130" height="90" rx="14" fill="#7d5a47"/>
    <rect x="330" y="320" width="32" height="90" rx="12" fill="#6b4c3a"/>
    <rect x="428" y="320" width="32" height="90" rx="12" fill="#6b4c3a"/>
    <rect x="350" y="300" width="90" height="60" rx="12" fill="#8c6650"/>
  </g>
  <!-- bags -->
  <path d="M480 440c-20-50 0-86 36-86s56 36 36 86z" fill="#5d6b75"/>
  <path d="M560 445c-16-40 2-70 30-70s44 30 30 70z" fill="#48555e"/>
  <!-- lamp tipped -->
  <g transform="rotate(22 650 420)"><rect x="642" y="300" width="10" height="120" fill="#5b4632"/><path d="M620 300h64l-14-40h-36z" fill="#b89a6a"/></g>
  <!-- scattered items -->
  <circle cx="230" cy="470" r="22" fill="#8a6f53"/>
  <rect x="300" y="460" width="70" height="22" rx="6" fill="#6d5640" transform="rotate(-8 335 471)"/>
  <rect x="160" y="455" width="60" height="30" rx="5" fill="#9a7c58" transform="rotate(6 190 470)"/>
  <rect x="430" y="455" width="44" height="44" rx="6" fill="#7c6346"/>
  <!-- dust/mess specks -->
  <g fill="#5f4f3a" opacity=".5"><circle cx="520" cy="520" r="6"/><circle cx="600" cy="540" r="5"/><circle cx="120" cy="540" r="6"/><circle cx="700" cy="500" r="5"/></g>
</svg>
