<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cave vidée et nettoyée après débarras">
  <defs>
    <linearGradient id="acW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="1" stop-color="#d7dde2"/></linearGradient>
    <radialGradient id="acBulb" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fff3cf" stop-opacity=".85"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#acW)"/>
  <rect y="440" width="800" height="160" fill="#c2c8cd"/>
  <rect y="434" width="800" height="10" fill="#aab2b8"/>
  <!-- brick lines -->
  <g stroke="#cdd3d8" stroke-width="3" opacity=".7">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="220" x2="800" y2="220"/><line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="120" y1="20" x2="120" y2="120"/><line x1="320" y1="120" x2="320" y2="220"/><line x1="520" y1="20" x2="520" y2="120"/><line x1="640" y1="220" x2="640" y2="330"/>
  </g>
  <!-- bulb + light -->
  <line x1="400" y1="0" x2="400" y2="70" stroke="#9aa3aa" stroke-width="4"/>
  <circle cx="400" cy="82" r="16" fill="#ffe89a" stroke="#e6c95e" stroke-width="3"/>
  <polygon points="370,90 430,90 540,440 260,440" fill="url(#acBulb)"/>
  <!-- empty clean shelf -->
  <g stroke="#9aa3aa" stroke-width="6" fill="none">
    <rect x="120" y="250" width="180" height="190"/>
    <line x1="120" y1="313" x2="300" y2="313"/><line x1="120" y1="376" x2="300" y2="376"/>
  </g>
  <!-- swept broom resting -->
  <g transform="rotate(12 600 300)"><rect x="596" y="240" width="8" height="200" fill="#b98a4d"/><path d="M580 440h44l8 30h-60z" fill="#e0b56a"/></g>
</svg>
