<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grenier vidé et lumineux après débarras">
  <defs>
    <linearGradient id="agW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#eef0ea"/></linearGradient>
    <linearGradient id="agSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9fb"/><stop offset="1" stop-color="#eaf6ff"/></linearGradient>
    <linearGradient id="agBeam" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#fff7da" stop-opacity=".95"/><stop offset="1" stop-color="#fff7da" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#agW)"/>
  <!-- sloped roof -->
  <polygon points="0,260 400,40 800,260 800,0 0,0" fill="#e3e6df"/>
  <polygon points="0,260 400,40 800,260 800,140 400,-40 0,140" fill="#d7dbd2" opacity=".0"/>
  <!-- rafters -->
  <g stroke="#c2b79c" stroke-width="10">
    <line x1="120" y1="0" x2="220" y2="200"/><line x1="320" y1="0" x2="360" y2="160"/><line x1="680" y1="0" x2="580" y2="200"/><line x1="480" y1="0" x2="440" y2="160"/>
  </g>
  <polyline points="0,260 400,40 800,260" fill="none" stroke="#b9af95" stroke-width="12"/>
  <!-- floor -->
  <rect y="440" width="800" height="160" fill="#dfd2bb"/>
  <g stroke="#c9b793" stroke-width="2" opacity=".6"><line x1="0" y1="490" x2="800" y2="490"/><line x1="0" y1="545" x2="800" y2="545"/></g>
  <!-- skylight -->
  <polygon points="300,150 500,150 470,250 330,250" fill="url(#agSky)" stroke="#fff" stroke-width="8"/>
  <line x1="400" y1="150" x2="400" y2="250" stroke="#fff" stroke-width="6"/>
  <!-- light beam -->
  <polygon points="330,252 470,252 540,440 260,440" fill="url(#agBeam)"/>
  <!-- single tidy box -->
  <g stroke="#cbb083" stroke-width="3"><rect x="600" y="380" width="110" height="60" fill="#e6cf9f"/><line x1="655" y1="380" x2="655" y2="440"/></g>
</svg>
